name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git pkgconf github-cli qt6-base qt6-svg ktexteditor kparts kdbusaddons kwindowsystem syntax-highlighting ki18n qt6-tools
      - uses: actions/checkout@v4
      - name: Check that the tag matches src/version.h
        run: |
          version=$(sed -n 's/^#define LIEVE_VERSION "\(.*\)"/\1/p' src/version.h)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "src/version.h says $version, tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Build
        run: make -j"$(nproc)"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v head="## $GITHUB_REF_NAME" '$0 == head {found = 1; next} /^## / {found = 0} found' CHANGELOG.md > notes.md
          test -s notes.md || echo "Lieve $GITHUB_REF_NAME" > notes.md
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release create "$GITHUB_REF_NAME" --title "Lieve $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
