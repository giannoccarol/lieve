name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      # Optional: with this secret set, every release also updates the AUR package.
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git pkgconf github-cli qt6-base qt6-svg ktexteditor kparts kdbusaddons kwindowsystem syntax-highlighting ki18n qt6-tools
      - uses: actions/checkout@v4
      - name: Check that the tag matches src/version.h
        run: |
          version=$(sed -n 's/^#define LIEVE_VERSION "\(.*\)"/\1/p' src/version.h)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "src/version.h says $version, tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Build
        run: make -j"$(nproc)"
      - name: Test
        run: make -j"$(nproc)" check
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v head="## $GITHUB_REF_NAME" '$0 == head {found = 1; next} /^## / {found = 0} found' CHANGELOG.md > notes.md
          test -s notes.md || echo "Lieve $GITHUB_REF_NAME" > notes.md
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release create "$GITHUB_REF_NAME" --title "Lieve $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
      - name: Update the AUR package
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          pacman -S --noconfirm --needed openssh
          version="${GITHUB_REF_NAME#v}"
          sum=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz" | sha256sum | cut -d' ' -f1)
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur"
          git clone ssh://aur@aur.archlinux.org/lieve.git aur
          sed -e "s/^pkgver=.*/pkgver=$version/" -e "s/^pkgrel=.*/pkgrel=1/" -e "s/^sha256sums=.*/sha256sums=('$sum')/" \
            packaging/aur/lieve/PKGBUILD > aur/PKGBUILD
          # makepkg refuses to run as root, even just to print .SRCINFO
          useradd -m builder
          chown -R builder aur
          su builder -c 'cd aur && makepkg --printsrcinfo > .SRCINFO'
          cd aur
          git config user.name "$(git -C .. log -1 --format=%an)"
          git config user.email "$(git -C .. log -1 --format=%ae)"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || { git commit -m "Update to $version" && git push origin HEAD:master; }
