name: Windows

# Lieve for Windows, built in MSYS2 (UCRT64) with the same Makefile as on
# Linux. The result is a folder to unzip and run (artifact "lieve-windows").
on:
  push:
    branches: [main]
  workflow_dispatch:
  # From release.yml: the zip is also attached to that release.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make git
          pacboy: >-
            gcc:p pkgconf:p
            qt6-base:p qt6-svg:p qt6-tools:p qt6-imageformats:p qt6-translations:p
            ktexteditor:p kparts:p kxmlgui:p kcoreaddons:p kdbusaddons:p kwindowsystem:p
            syntax-highlighting:p kconfig:p kwidgetsaddons:p ki18n:p breeze-icons:p
            ripgrep:p
      - name: Build
        run: make -j"$(nproc)"
      - name: Test
        run: make -j"$(nproc)" check
      - name: Package
        run: bash packaging/windows/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lieve-windows
          path: dist/Lieve
      - name: Attach the zip to the release
        if: inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "Lieve-${{ inputs.tag }}-windows-x64.zip"
          Compress-Archive -Path dist/Lieve -DestinationPath $zip
          gh release upload "${{ inputs.tag }}" $zip --clobber --repo "${{ github.repository }}"
